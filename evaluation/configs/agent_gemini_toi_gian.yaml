# TN3 (agent) / TN4 (an toàn). Chạy: python evaluation/run_agent.py --configs agent_gemini_toi_gian
ma: agent_gemini_toi_gian
ten: "Gemini 3.5 Flash-Lite (gói miễn phí), mô tả công cụ tối giản"
llm_model: gemini/gemini-3.5-flash-lite
mo_ta_cong_cu: toi_gian      # day_du = docstring thật | toi_gian = chỉ tên công cụ + mô tả tham số tối thiểu
corpus: evaluation/corpus_demo
embedding: intfloat/multilingual-e5-base
# Ghi đè giá (USD / 1 triệu token) nếu bảng giá của LiteLLM chưa đúng; để trống = dùng LiteLLM
gia_vao_usd_trieu_token: 0   # gói miễn phí Google AI Studio
gia_ra_usd_trieu_token: 0
cho_giua_luot_goi_giay: 4.5  # gói miễn phí 15 lượt/phút -> >= 4 giây/lượt (trợ lý + LLM chấm dùng chung)
