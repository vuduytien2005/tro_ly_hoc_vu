# TUỲ CHỌN: chạy MySQL bằng Docker thay vì cài đặt trực tiếp.
# Lần chạy đầu tiên tự tạo 2 CSDL, dữ liệu mẫu và user "troly".
# Đổi mật khẩu trong docker/mysql/99_grants.sql cho khớp với DB_PASSWORD trong .env
# Lệnh: docker compose up -d     |  Xóa sạch dữ liệu: docker compose down -v
services:
  mysql:
    image: mysql:8.4
    container_name: tro-ly-hoc-vu-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_doi_mat_khau
      TZ: Asia/Ho_Chi_Minh
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-ft-min-token-size=1
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/01_qlsv_schema.sql:/docker-entrypoint-initdb.d/01_qlsv_schema.sql:ro
      - ./database/02_assistant_schema.sql:/docker-entrypoint-initdb.d/02_assistant_schema.sql:ro
      - ./database/03_qlsv_seed.sql:/docker-entrypoint-initdb.d/03_qlsv_seed.sql:ro
      - ./database/04_assistant_seed.sql:/docker-entrypoint-initdb.d/04_assistant_seed.sql:ro
      - ./docker/mysql/99_grants.sql:/docker-entrypoint-initdb.d/99_grants.sql:ro

volumes:
  mysql_data:
